<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PARA//LELO · Explorar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/hito2.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" aria-label="PARA//LELO, inicio">PARA//LELO</a>
      <nav class="main-nav" id="menu-principal" aria-label="Principal">
        <a href="index.html" aria-current="page">Explorar</a>
        <a href="crear.html">Publicar</a>
        <a href="login.html">Mi cuenta</a>
      </nav>
      <div class="header-actions">
        <a href="#" class="cart" aria-label="Carrito, 0 artículos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span>0</span></a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <main>
    <section class="hero container" aria-labelledby="hero-title">
      <h1 id="hero-title" class="display">Lo común no entra aquí.</h1>
      <p class="hero-note"><span>Hola, Alex.<br>Hay <b id="total-novedades">0</b> objetos nuevos esperando.</span></p>
    </section>

    <section class="catalog container" aria-labelledby="catalog-title">
      <div class="catalog-head">
        <div>
          <h2 id="catalog-title">Explora el drop</h2>
          <p class="contador" id="contador-resultados" aria-live="polite"></p>
        </div>
        <button class="search-btn" type="button" aria-label="Buscar" aria-expanded="false" aria-controls="panel-busqueda">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
      </div>

      <div class="panel-busqueda" id="panel-busqueda" role="search" hidden>
        <label for="buscador" class="visually-hidden">Buscar objetos</label>
        <input type="search" id="buscador" placeholder="Busca por nombre, categoría o descripción…" autocomplete="off">
        <button type="button" id="limpiar-busqueda" class="limpiar" aria-label="Borrar búsqueda" hidden>✕</button>
      </div>

      <div class="filters" role="group" aria-label="Filtrar por categoría">
        <button class="chip" data-filter="todo" aria-pressed="true">Todo</button>
        <button class="chip" data-filter="calzado" aria-pressed="false">Calzado</button>
        <button class="chip" data-filter="audio" aria-pressed="false">Audio</button>
        <button class="chip" data-filter="objetos" aria-pressed="false">Objetos</button>
        <button class="chip" data-filter="wearables" aria-pressed="false">Wearables</button>
      </div>

      <!-- Las tarjetas se generan con JS a partir de mockData.js -->
      <div class="grid" id="grid"></div>

      <div class="sin-resultados" id="sin-resultados" hidden>
        <p>No hay nada que coincida con «<strong></strong>».</p>
        <small>Prueba con otra palabra o cambia de categoría.</small>
      </div>

      <template id="tpl-tarjeta">
        <article class="card">
          <a href="#">
            <figure><img src="img/airform01.jpg" alt="" loading="lazy"><span class="num"></span><span class="stock"></span></figure>
            <div class="card-info"><div><small></small><h3></h3></div><span class="price"></span></div>
          </a>
        </article>
      </template>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container"><p>© 2025 PARA//LELO · Curado por humanos</p><p>Envíos globales</p></div>
  </footer>
  <script src="js/mockData.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
